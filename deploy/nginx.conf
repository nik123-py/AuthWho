# AuthWho reverse proxy. TLS is terminated in front of this server (see docs/deployment.md)
# or by deploy/nginx.tls.conf.

# Paths only, never query strings: the dashboard's WebSocket carries the admin token there.
log_format authwho '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
access_log /var/log/nginx/access.log authwho;

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=batches:10m rate=20r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 128k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Demo application API (same origin, so its session cookie stays first-party).
    location = /api/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://demo:8100;
    }
    location /api/ {
        proxy_pass http://demo:8100;
    }

    # AuthWho: only the SDK batch endpoint and the admin API are public.
    location = /v1/batches {
        limit_req zone=batches burst=40 nodelay;
        proxy_pass http://api:8000;
    }
    location = /v1/admin/ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /v1/admin/ {
        proxy_pass http://api:8000;
    }
    # User, session and session-control routes are server to server only.
    location /v1/ {
        return 404;
    }
    location = /healthz {
        proxy_pass http://api:8000;
    }

    # Admin dashboard and demo application.
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
    location / {
        root /usr/share/nginx/html/app;
        try_files $uri /index.html;
    }
}
