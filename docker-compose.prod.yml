# AuthWho production stack: one command on a single host.
#
#   .venv/Scripts/python -m server.common.production --domain your.domain > .env.production
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Only the web container publishes a port. PostgreSQL and Redis stay on the internal
# network; Redis keeps nothing on disk, so raw events never reach disk.

x-python: &python
  build:
    context: .
    dockerfile: deploy/python.Dockerfile
  image: authwho-python:latest
  env_file: .env.production
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *python
    command: ["python", "-m", "server.db.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *python
    command: ["python", "-m", "uvicorn", "server.api.app:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log",
              "--timeout-graceful-shutdown", "5"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *python
    command: ["python", "-m", "server.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  retention:
    <<: *python
    # Enforces the retention table of proposal Section 9 every hour.
    command: ["sh", "-c", "while true; do python -m server.db.retention; sleep 3600; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  demo:
    <<: *python
    command: ["python", "-m", "uvicorn", "demo_app.backend.app:app", "--host", "0.0.0.0", "--port", "8100",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log",
              "--timeout-graceful-shutdown", "5"]
    volumes:
      - demodata:/data/demo
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/registry')"]
      interval: 10s
      timeout: 5s
      retries: 10

  research:
    <<: *python
    # Volunteer research export; only for users who gave research consent. Off unless enabled:
    #   docker compose --profile research ...
    command: ["python", "-m", "server.research"]
    volumes:
      - researchdata:/app/data/volunteer
    profiles: ["research"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: authwho-web:latest
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
      demo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  demodata:
  researchdata:
