# AuthWho continuous integration.
#
# Runs on GitHub's free ubuntu-latest runners for every push and pull request.
# No paid services and no real secrets: every credential below is a fixed,
# obviously fake dummy value that only works against the throwaway service
# containers started for the job.
#
# Pytest exits with code 5 when no tests are collected (for example when a
# marker selects nothing in an early phase). The pytest steps treat exit code 5
# as success and pass every other non-zero exit code through unchanged, so real
# failures, collection errors and usage errors still fail the job.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests (pytest, not integration)
        shell: bash
        run: |
          status=0
          python -m pytest -m "not integration" || status=$?
          if [ "$status" -eq 5 ]; then
            echo "::notice title=pytest::No unit tests collected yet; treating as success."
            exit 0
          fi
          exit "$status"

  python-integration:
    name: Python integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Only PostgreSQL runs as a service container. Redis is started in a
      # step below because service containers cannot take a command, and the
      # no-persistence flags from docker-compose.yml must apply in CI too.
      postgres:
        image: postgres:16-alpine
        # Must equal POSTGRES_* in the job env below (the env context is not
        # available inside services). POSTGRES_USER is created as a superuser,
        # so the integration fixtures can create the separate authwho_test
        # database.
        env:
          POSTGRES_USER: authwho
          POSTGRES_PASSWORD: dummy-change-me
          POSTGRES_DB: authwho
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authwho -d authwho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Mirrors .env.example exactly. Dummy values only; no GitHub secrets are
      # needed. The integration fixtures in server/common/testing.py derive
      # their own targets from these: database authwho_test and Redis DB 15.
      POSTGRES_USER: authwho
      POSTGRES_PASSWORD: dummy-change-me
      POSTGRES_DB: authwho
      AUTHWHO_DATABASE_URL: postgresql://authwho:dummy-change-me@127.0.0.1:5432/authwho
      AUTHWHO_REDIS_URL: redis://127.0.0.1:6379/0
      AUTHWHO_DATA_KEY: ZHVtbXktYXV0aHdoby1kYXRhLWtleS0zMi1ieXRlcyE=
      AUTHWHO_APP_API_KEY: dummy-app-api-key
      AUTHWHO_ADMIN_TOKEN: dummy-admin-token
      AUTHWHO_CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      AUTHWHO_COLLECTOR_URL: http://127.0.0.1:8000
      DEMO_DB_PATH: data/demo/demo.sqlite
      DEMO_SECRET_KEY: dummy-demo-secret-key
      DEMO_TOTP_KEY: ZHVtbXktZGVtby10b3RwLWtleS0zMi1ieXRlcy1vayE=
      RESEARCH_EXPORT_KEY: ZHVtbXktcmVzZWFyY2gtZXhwb3J0LWtleS0zMmJ5dGU=
      DEMO_WITHDRAWAL_RETRY_SECONDS: "300"
    steps:
      - name: Start Redis without persistence
        # Same image and flags as docker-compose.yml: no RDB snapshots and no
        # append-only file, so raw events never reach disk.
        shell: bash
        run: |
          docker run -d --name redis -p 127.0.0.1:6379:6379 redis:7-alpine redis-server --save "" --appendonly no
          for attempt in $(seq 1 30); do
            if [ "$(docker exec redis redis-cli ping 2>/dev/null)" = "PONG" ]; then
              echo "Redis is ready after ${attempt} attempt(s)."
              docker exec redis redis-cli config get save
              docker exec redis redis-cli config get appendonly
              exit 0
            fi
            sleep 1
          done
          echo "::error title=redis::Redis did not answer PING within 30 seconds."
          docker logs redis
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run integration tests (pytest, PostgreSQL and Redis)
        shell: bash
        run: |
          status=0
          python -m pytest -m integration || status=$?
          if [ "$status" -eq 5 ]; then
            echo "::notice title=pytest::No integration tests collected yet; treating as success."
            exit 0
          fi
          exit "$status"

  node:
    name: Node (Vitest in every workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run Vitest in every workspace
        run: npm test

